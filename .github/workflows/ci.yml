# PR と main への push のたびに、画面（lint・テスト・ビルド）・API（テスト）・E2E テスト（画面から DB まで通し）を自動で確かめる。
# ジョブの名前 `check` は、GitHub のルールセットで「必須のチェック」にするときの名前。
name: CI

on:
  pull_request:
  push:
    branches: [main]

# このワークフローが使える権限を、リポジトリの読み取りだけにする
permissions:
  contents: read

# 同じ PR で続けて push したら、古い実行は止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # ---- 画面（React + Vite） ----
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: 画面の部品を入れる
        run: npm ci
        working-directory: frontend
      - name: 画面の lint
        run: npm run lint
        working-directory: frontend
      - name: 画面のテスト（網羅率も測る）
        run: npm run coverage
        working-directory: frontend
      - name: 画面のビルド
        run: npm run build
        working-directory: frontend

      # ---- API（Spring Boot）。テストは Testcontainers が PostgreSQL を Docker で起動する ----
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: API のテスト（網羅率も測る）
        run: ./gradlew test
        working-directory: backend

      # ---- E2E テスト（Playwright）。画面・API・DB をつないで、実際のブラウザで確かめる ----
      # テストの前に、DB の起動と、専用の DB（memo_e2e）の作成を行う。画面と API は、Playwright が起動する
      - name: E2E 用に DB を起動する（.env は、この実行だけの使い捨ての値で作る）
        run: |
          printf 'DB_NAME=memo\nDB_USER=memo\nDB_PASSWORD=%s\n' "$(openssl rand -hex 16)" > .env
          docker compose up -d --wait
      - name: E2E の部品を入れる
        run: npm ci
        working-directory: e2e
      - name: E2E 用のブラウザ（Chromium）を入れる
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: E2E テスト
        run: npm test
        working-directory: e2e
      - name: E2E が失敗したときの記録（画面・動画・操作の履歴）を保存する
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-records
          path: |
            e2e/test-results
            e2e/playwright-report
          retention-days: 7
          if-no-files-found: ignore

      # ---- 網羅率を、この実行の「Summary」に表で出す（測るだけ。低くても失敗にはしない） ----
      - name: 網羅率を Summary に出す
        if: always()
        run: node .github/scripts/coverage-summary.mjs | tee -a "$GITHUB_STEP_SUMMARY"

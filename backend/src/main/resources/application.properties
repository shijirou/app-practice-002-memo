spring.application.name=memo
server.port=8080

# DB の接続情報は、リポジトリ直下の .env（GitHub には載せない）か、環境変数から読む
spring.config.import=optional:file:../.env[.properties]
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:memo}
spring.datasource.username=${DB_USER:memo}
spring.datasource.password=${DB_PASSWORD:}

# 表は Flyway（src/main/resources/db/migration）で作る。JPA は表の形を確かめるだけ
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
